name: Szymon Training Hub CI

on:
  push:
    branches: [main]
    paths:
      - 'strava-garmin-hub-mvp/strava-garmin-hub/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'strava-garmin-hub-mvp/strava-garmin-hub/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strava-garmin-hub-mvp/strava-garmin-hub/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: strava-garmin-hub-mvp/strava-garmin-hub/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: DATABASE_URL=sqlite:///./ci_test.db python -m pytest -q

  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: strava-garmin-hub-mvp/strava-garmin-hub/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: szymon-training-hub-debug-apk
          path: strava-garmin-hub-mvp/strava-garmin-hub/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
