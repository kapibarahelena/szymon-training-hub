services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: traininghub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-too}
    volumes:
      - traininghub-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d traininghub"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hub:${POSTGRES_PASSWORD:-change-this-too}@db:5432/traininghub
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  traininghub-db:
